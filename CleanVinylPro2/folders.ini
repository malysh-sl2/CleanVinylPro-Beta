; ==============================================================================
;  ЧИСТИЙ ВІНІЛ PRO 2 - СПІЛЬНІ ПАПКИ
; ==============================================================================
;  Тут записано, де на цьому комп'ютері лежить усе важке: AI-моделі, Python і
;  його бібліотеки. Ці папки спільні для всіх версій програми, тому нова версія
;  нічого не завантажує вдруге - вона бере готове звідси.
;
;  Якщо ви щось перенесли в інше місце - виправте шлях у відповідному рядку
;  (Блокнотом), збережіть файл і запустіть install_windows.bat.
;
;  Як писати: одразу після знака = іде шлях. Лапки не потрібні, пробіли в назвах
;  папок дозволені. Рядки, що починаються з крапки з комою, - пояснення.
;  Якщо рядок залишити порожнім (нічого після =), програма триматиме це у своїй
;  папці, як у попередніх версіях.
; ==============================================================================

; Папка з AI-моделями (файли bria-rmbg-2.0.onnx і lama_fp32.onnx, разом 1,2 ГБ).
; Моделі можуть лежати прямо в ній або в папці всередині неї.
; Якщо якогось файлу бракує, він завантажиться сюди - один раз для всіх версій.
MODELS_DIR=D:\model AI fotoshop

; Папка, де встановлено Python (та, в якій лежить python.exe).
PYTHON_DIR=C:\Users\malys\AppData\Local\Programs\Python\Python312

; Папка для бібліотек Python (OpenCV, ONNX Runtime, CUDA - разом 2-4 ГБ).
; Вони ставляться сюди один раз, а кожна версія програми лише посилається на них.
LIBS_DIR=D:\model AI fotoshop\CleanVinyl_python_libs
